<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sharon Caspi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Figma prototype flow: Desktop 5 (1:34) → Desktop 4 (1:57) → Desktop 2 (1:13), 1600ms each -->
  <main class="hero" data-layout="trio">

    <!-- Desktop 5 (1:34): three photos along the bottom -->
    <div class="layout layout--trio" aria-hidden="true">
      <ul class="trio">
        <li class="photo"><img src="assets/hero-trio.png" alt="" onerror="this.remove()"></li>
        <li class="photo"><img src="assets/hero-trio.png" alt="" onerror="this.remove()"></li>
        <li class="photo"><img src="assets/hero-trio.png" alt="" onerror="this.remove()"></li>
      </ul>
    </div>

    <!-- Desktop 4 (1:57): collage -->
    <div class="layout layout--collage" aria-hidden="true">
      <figure class="photo photo--collage-left"><img src="assets/hero-collage.png" alt="" onerror="this.remove()"></figure>
      <figure class="photo photo--collage-right"><img src="assets/hero-collage.png" alt="" onerror="this.remove()"></figure>
      <figure class="photo photo--collage-centre"><img src="assets/hero-collage.png" alt="" onerror="this.remove()"></figure>
    </div>

    <!-- Desktop 2 (1:13): single tall photo -->
    <div class="layout layout--single" aria-hidden="true">
      <figure class="photo photo--single"><img src="assets/hero-single.png" alt="" onerror="this.remove()"></figure>
    </div>

    <nav class="nav" aria-label="Main">
      <ul>
        <li><a href="#work">WORK</a></li>
        <li><a href="#blog">BLOG</a></li>
        <li><a href="#playground">PLAYGROUND</a></li>
        <li><a href="#about">ABOUT</a></li>
        <li><a href="#contact">CONTACT</a></li>
      </ul>
    </nav>

    <header class="title">
      <h1>SHARON CASPI</h1>
      <p>PILATES PRINCESS + TREND SETTER</p>
    </header>
  </main>

  <script>
    (function () {
      var hero = document.querySelector('.hero');

      // Scale the 1440 × 784 frame to fit the window, like the Figma prototype view.
      function fit() {
        var s = Math.min(window.innerWidth / 1440, window.innerHeight / 784);
        hero.style.setProperty('--fit', s);
      }
      fit();
      window.addEventListener('resize', fit);

      // Flow 1: "After delay 1600ms → Navigate to", instant transition, in a loop.
      var sequence = ['trio', 'collage', 'single'];
      var i = 0;
      setInterval(function () {
        i = (i + 1) % sequence.length;
        hero.setAttribute('data-layout', sequence[i]);
      }, 1600);
    })();
  </script>
</body>
</html>
